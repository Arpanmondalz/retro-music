<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Totem // AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="dashboard">
        <!-- LEFT: VISUALS -->
        <div class="panel-left">
            <div class="cassette-wrapper" id="cassette-unit">
                <img src="tape.png" class="cassette-bg" alt="Cassette">
                <div class="spool left-spool"></div>
                <div class="spool right-spool"></div>
                
                <!-- Song Title Display -->
                <div class="digital-label">
                    <span id="track-marquee">SYSTEM READY</span>
                </div>
                
                <!-- Scanner Viewfinder -->
                <div id="scanner-overlay"></div>
            </div>
        </div>

        <!-- RIGHT: CONTROLS -->
        <div class="panel-right">
            <div class="header-row">
                <div class="header-title">Mood // AI</div>
                <div class="status-led" id="led"></div>
            </div>

            <div class="slider-container">
                <div class="slider-row">
                    <div class="label-row"><span>ENERGY</span><span>LOW — HIGH</span></div>
                    <input type="range" id="energy" value="50">
                </div>
                <div class="slider-row">
                    <div class="label-row"><span>EMOTION</span><span>SAD — HAPPY</span></div>
                    <input type="range" id="valence" value="50">
                </div>
                <div class="slider-row">
                    <div class="label-row"><span>TEXTURE</span><span>SYNTH — ORG</span></div>
                    <input type="range" id="acoustic" value="50">
                </div>
                <div class="slider-row">
                    <div class="label-row"><span>VOCALS</span><span>INST — SONG</span></div>
                    <input type="range" id="vocal" value="50">
                </div>
            </div>

            <div class="option-row">
                <label>LANG:</label>
                <select id="lang-select">
                    <option value="Hindi">Hindi</option>
                    <option value="English">English</option>
                    <option value="Bengali">Bengali</option>
                    <option value="Tamil">Tamil</option>
                    <option value="Instrumental">No Language</option>
                    <option value="Any">Surprise Me</option>
                </select>
            </div>

            <div class="btn-group">
                <button onclick="toggleScanner()">SCAN TAPE</button>
                <button class="btn-primary" onclick="synthesizeTrack()">SYNTHESIZE</button>
                <button onclick="synthesizeTrack()">⏭ SKIP</button>
                <button class="btn-stop" onclick="stopTrack()">STOP</button>
            </div>
            
            <div id="status-log">Ready.</div>
        </div>
    </div>

    <!-- Hidden Player -->
    <div id="player-hide"></div>
    <script src="script.js"></script>

</body>
</html>
