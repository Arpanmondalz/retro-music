<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA MANIFEST -->
    <link rel="manifest" href="manifest.json">
    
    <!-- THEME COLOR (Matches your beige bg) -->
    <meta name="theme-color" content="#121212">
    
    <!-- iOS SUPPORT -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <title>Mood Totem // AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="dashboard">
        <!-- LEFT: VISUALS -->
        <div class="panel-left">
            <div class="cassette-wrapper" id="cassette-unit">
                <img src="tape.png" class="cassette-bg" alt="Cassette">
                <div class="spool left-spool"></div>
                <div class="spool right-spool"></div>
                
                <!-- Song Title Display -->
                <div class="digital-label">
                    <span id="track-marquee">SYSTEM READY</span>
                </div>
                
                <!-- Scanner Viewfinder -->
                <div id="scanner-overlay"></div>
            </div>
        </div>

        <!-- RIGHT: CONTROLS -->
        <div class="panel-right">
            <div class="header-row">
                <div class="header-title">Mood // AI</div>
                <div class="status-led" id="led"></div>
            </div>

            <!-- ENERGY (Calm -> Intense) -->
            <div class="slider-container">
                <div class="label-row"><span>CALM</span><span>INTENSE</span></div>
                <input type="range" id="energy" min="0" max="100" value="50">
            </div>

            <!-- VALENCE (Sad -> Happy) -->
            <div class="slider-container">
                <div class="label-row"><span>MELANCHOLY</span><span>EUPHORIA</span></div>
                <input type="range" id="valence" min="0" max="100" value="50">
            </div>

            <!-- NOSTALGIA (Modern -> Retro) - REPLACES TEXTURE -->
            <div class="slider-container">
                <div class="label-row"><span>MODERN</span><span>RETRO</span></div>
                <input type="range" id="nostalgia" min="0" max="100" value="50">
            </div>

            <!-- VOCALS (Inst -> Lyrical) -->
            <div class="slider-container">
                <div class="label-row"><span>INSTRUMENTAL</span><span>LYRICAL</span></div>
                <input type="range" id="vocal" min="0" max="100" value="50">
            </div>

            <!-- OBSCURITY (Pop -> Underground) -->
            <div class="slider-container">
                <div class="label-row"><span>POPULAR</span><span>HIDDEN GEM</span></div>
                <input type="range" id="discovery" min="0" max="100" value="20">
            </div>


            <div class="option-row">
                <label>LANG:</label>
                <select id="lang-select">
                    <option value="Hindi">Hindi</option>
                    <option value="English">English</option>
                    <option value="Bengali">Bengali</option>
                    <option value="Tamil">Tamil</option>
                    <option value="Telugu">Telugu</option>
                    <option value="Kannada">Kannada</option>
                    <option value="Instrumental">No Language</option>
                    <option value="Any">Surprise Me</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="toggleScanner()">SCAN TAPE</button>
                <button class="btn-primary" onclick="synthesizeTrack()">SYNTHESIZE</button>
                <button onclick="synthesizeTrack()">⏭ SKIP</button>
                <button class="btn-stop" onclick="stopTrack()">STOP</button>
            </div>
            
            <div id="status-log">Ready.</div>
        </div>
    </div>

    <!-- Hidden Player -->
    <div id="player-hide"></div>
    <script src="script.js"></script>

</body>
</html>
